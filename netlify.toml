# Netlify 설정 — 정적 사이트 + Claude 프록시 함수
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# 팀 공유 기록 보존정책 — 매일 실행, 첫 등록 2년 경과분 삭제
[functions."team-cleanup"]
  schedule = "@daily"

# 프론트가 호출하는 /api/chat 를 프록시 함수로 연결 (rewrite)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# 로그 내보내기 (few-shot용 JSONL) — LOG_EXPORT_KEY 필요
[[redirects]]
  from = "/api/logs-export"
  to = "/.netlify/functions/logs-export"
  status = 200

# 팀 공유 점검 기록 (저장/목록/불러오기) — SYNC_KEY 필요
[[redirects]]
  from = "/api/team"
  to = "/.netlify/functions/team"
  status = 200

# 앱 접근 비밀번호 (내부 전용 잠금) — APP_PASSWORD / ADMIN_KEY
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# 관리자용 Blobs 조회 (읽기 전용) — ADMIN_KEY 필요
[[redirects]]
  from = "/api/admin-blobs"
  to = "/.netlify/functions/admin-blobs"
  status = 200

# 관리자 전용 전체 점검 기록 조회 — ADMIN_KEY 필요
[[redirects]]
  from = "/api/admin-results"
  to = "/.netlify/functions/admin-results"
  status = 200
