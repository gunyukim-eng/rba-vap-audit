# Netlify 설정 — 정적 사이트 + Claude 프록시 함수
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# 프론트가 호출하는 /api/chat 를 프록시 함수로 연결 (rewrite)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# 로그 내보내기 (few-shot용 JSONL) — LOG_EXPORT_KEY 필요
[[redirects]]
  from = "/api/logs-export"
  to = "/.netlify/functions/logs-export"
  status = 200

# 팀 공유 점검 기록 (저장/목록/불러오기) — SYNC_KEY 필요
[[redirects]]
  from = "/api/team"
  to = "/.netlify/functions/team"
  status = 200
