<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>capture</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div id="app"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoInput(event)">
<div id="photoViewer" onclick="closePhotoViewer()">
  <button id="photoViewerClose" onclick="closePhotoViewer()">×</button>
  <img id="photoViewerImg" src="" alt="">
</div>
<button id="aiFab" onclick="aiOpen()" title="AI 도우미">✦</button>
<input type="file" id="aiFileInput" accept="image/*" multiple style="display:none" onchange="aiHandleFiles(event)">
<div id="aiScrim" class="ai-hidden" onclick="aiClose()"></div>
<div id="aiPanel" class="ai-hidden">
  <div class="ai-head">
    <span class="t" id="aiTitle">AI 도우미 · 문서분석 & 질의</span>
    <button onclick="aiToggleSettings()" title="설정">⚙</button>
    <button onclick="aiClose()" title="닫기">×</button>
  </div>
  <div id="aiBody" class="ai-body"></div>
  <div id="aiFoot" class="ai-foot">
    <div id="aiAttach" class="ai-attach"></div>
    <div class="ai-inrow">
      <button class="ai-icbtn" onclick="document.getElementById('aiFileInput').click()" title="문서 사진 첨부">📷</button>
      <textarea id="aiInput" rows="1" placeholder="질문을 입력하거나 문서 사진을 첨부하세요…" oninput="aiAutoGrow(this)" onkeydown="aiKeydown(event)"></textarea>
      <button id="aiSendBtn" class="ai-icbtn ai-send" onclick="aiSend()" title="보내기">➤</button>
    </div>
  </div>
  <div id="aiCfg" class="ai-cfg ai-hidden"></div>
</div>
<script src="../app.js"></script>
<script>
// ── 매뉴얼용 스크린샷 캡처 하니스 (?shot=키&lang=ko|en) ──
(function(){
  const q=new URLSearchParams(location.search);
  const shot=q.get('shot'); if(!shot)return;
  const LANG=(location.hash.slice(1)==='en')?'en':'ko';
  const en=LANG==='en';
  function seed(){
    S=initState();S.vendorCode='DEMO-01';S.country=en?'Vietnam':'베트남';S.lang=LANG;
    ['a11','a12','a21','a22','a31'].forEach(id=>{S.done[id]=true;});
  }
  const aiDemo=en
    ?{suggested_grade:'minor',confidence:0.82,doc_summary:'Employment contract in Vietnamese + Korean. Signature and seal confirmed. Some required fields (working hours) are missing.',rationale:'Minor ① applies — a contract exists but some terms are incomplete.',answers:[{q_id:'Q1',answer:'yes',evidence:'Native language (Vietnamese) present'},{q_id:'Q2',answer:'no',evidence:'Working-hours clause missing'}]}
    :{suggested_grade:'minor',confidence:0.82,doc_summary:'베트남어·한국어 병기 근로계약서. 서명·직인 확인됨. 필수기재 중 근로시간 조항 일부 누락.',rationale:'판정기준 Minor ① 적용 — 계약서는 있으나 일부 조건 누락.',answers:[{q_id:'Q1',answer:'yes',evidence:'모국어(베트남어) 병기 확인'},{q_id:'Q2',answer:'no',evidence:'필수기재 중 근로시간 누락'}]};
  const C={
    share1:{ko:'여기를 눌러 협력사 사전점검을 요청',en:'Tap here to request supplier pre-check'},
    share2:{ko:'링크 복사 → 협력사에 전달',en:'Copy link → send to supplier'},
    excel:{ko:'점검 결과를 Excel(CSV)로 내보내기',en:'Export results to Excel (CSV)'},
    aibtn:{ko:'문서 사진으로 AI 등급 자동판정',en:'AI auto-judge from document photos'},
    aicard:{ko:'[제안 적용]을 누르면 문항에 반영',en:'Tap [Apply] to prefill the questions'},
    aichat:{ko:'설정(⚙)에서 API 키 입력 후 저장',en:'Enter your API key in Settings, then Save'},
    save:{ko:'저장된 점검 — 눌러서 이어서 작업',en:'Saved audit — tap to resume'},
    fab:{ko:'✦ AI 도우미 — 문서분석·질의',en:'✦ AI assistant — analysis & Q&A'},
  };
  const SHOTS={
    share1:{setup(){seed();S.screen='home';S.homeTab='audit';},sel:'button[onclick*="supgen"]'},
    share2:{setup(){seed();S.screen='supgen';},sel:'#copyBtn'},
    excel:{setup(){seed();S.screen='home';S.homeTab='audit';},sel:'button[onclick*="exportCSV"]'},
    aibtn:{setup(){seed();S.homeTab='nsup';S.screen='nsupItem';S.nsupItem='A0103';},sel:'button[onclick*="aiJudgeOpen"]'},
    aicard:{setup(){seed();S.homeTab='nsup';S.screen='nsupItem';S.nsupItem='A0103';S.nsupOpen={ai_A0103:true};S.nsupAI={A0103:aiDemo};},sel:'.ai-sugg .ap'},
    aichat:{setup(){seed();S.screen='home';},after(){document.getElementById('aiScrim').classList.remove('ai-hidden');document.getElementById('aiPanel').classList.remove('ai-hidden');var t=document.getElementById('aiTitle');if(t)t.textContent=en?'AI Assistant · Docs & Q&A':'AI 도우미 · 문서분석 & 질의';aiToggleSettings();},sel:'#aiCfgKey'},
    save:{setup(){localStorage.setItem('vap_sessions',JSON.stringify([{code:'DEMO-01',country:en?'Vietnam':'베트남',lang:LANG,lastUpdated:new Date().toISOString(),rate:75,done:8,total:19}]));S=initState();S.lang=LANG;S.screen='landing';},sel:'.sess-card'},
    fab:{setup(){seed();S.screen='home';},sel:'#aiFab'},
  };
  const cfg=SHOTS[shot];
  if(!cfg){document.title='NOSHOT';return;}
  const cap=(C[shot]||{})[LANG]||'';
  const st=document.createElement('style');
  st.textContent='html,body,#app{min-height:0!important}'+(shot==='fab'?'':'#aiFab{display:none!important}');
  document.head.appendChild(st);
  cfg.setup();render();
  if(cfg.after)cfg.after();
  setTimeout(()=>{
    const el=document.querySelector(cfg.sel);
    if(el){
      const r=el.getBoundingClientRect();
      const ax=r.left+window.scrollX, ay=r.top+window.scrollY;
      const ring=document.createElement('div');
      ring.style.cssText='position:absolute;left:'+(ax-5)+'px;top:'+(ay-5)+'px;width:'+(r.width+10)+'px;height:'+(r.height+10)+'px;border:3px solid #ff3b30;border-radius:12px;box-shadow:0 0 0 4px rgba(255,59,48,.20);z-index:99998;pointer-events:none';
      document.body.appendChild(ring);
      if(cap){
        const lab=document.createElement('div');
        lab.textContent='👉 '+cap;
        // 대상 위에 공간이 있으면 위, 없으면 아래에 배치 (버튼을 가리지 않음)
        let ly=ay-44; if(ly<8) ly=ay+r.height+12;
        lab.style.cssText='position:absolute;left:8px;right:8px;top:'+ly+'px;background:#ff3b30;color:#fff;font:700 13px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;padding:7px 11px;border-radius:10px;z-index:99999;box-shadow:0 3px 10px rgba(0,0,0,.25)';
        document.body.appendChild(lab);
      }
      document.title='H'+Math.min(3600,Math.ceil(ay+r.height+60));
    } else { document.title='NOEL'; }
  },200);
})();
</script>
</body>
</html>
