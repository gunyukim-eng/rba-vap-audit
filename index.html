<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>On-Site Audit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoInput(event)">
<div id="photoViewer" onclick="closePhotoViewer()">
  <button id="photoViewerClose" onclick="closePhotoViewer()">×</button>
  <img id="photoViewerImg" src="" alt="">
</div>

<!-- ── AI 챗봇 / OCR 문서분석 ── -->
<button id="aiFab" onclick="aiOpen()" title="AI 도우미">✦</button>
<input type="file" id="aiFileInput" accept="image/*" multiple style="display:none" onchange="aiHandleFiles(event)">
<div id="aiScrim" class="ai-hidden" onclick="aiClose()"></div>
<div id="aiPanel" class="ai-hidden">
  <div class="ai-head">
    <span class="t" id="aiTitle">AI 도우미 · 문서분석 & 질의</span>
    <button onclick="aiToggleSettings()" title="설정">⚙</button>
    <button onclick="aiClose()" title="닫기">×</button>
  </div>
  <div id="aiBody" class="ai-body"></div>
  <div id="aiFoot" class="ai-foot">
    <div id="aiAttach" class="ai-attach"></div>
    <div class="ai-inrow">
      <button class="ai-icbtn" onclick="document.getElementById('aiFileInput').click()" title="문서 사진 첨부">📷</button>
      <textarea id="aiInput" rows="1" placeholder="질문을 입력하거나 문서 사진을 첨부하세요…" oninput="aiAutoGrow(this)" onkeydown="aiKeydown(event)"></textarea>
      <button id="aiSendBtn" class="ai-icbtn ai-send" onclick="aiSend()" title="보내기">➤</button>
    </div>
  </div>
  <div id="aiCfg" class="ai-cfg ai-hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
